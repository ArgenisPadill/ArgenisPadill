<svg width="1280" height="320" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
    <stop stop-color="#07111F"/><stop offset=".5" stop-color="#0B1628"/><stop offset="1" stop-color="#111827"/>
  </linearGradient>
  <linearGradient id="accent" x1="80" y1="0" x2="1170" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#38BDF8"/><stop offset=".5" stop-color="#60A5FA"/><stop offset="1" stop-color="#A78BFA"/>
  </linearGradient>
  <radialGradient id="glowA"><stop stop-color="#38BDF8" stop-opacity=".28"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowB"><stop stop-color="#A78BFA" stop-opacity=".20"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#94A3B8" stroke-opacity=".05"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
</defs>
<style>
  .a{animation:floatA 9s ease-in-out infinite alternate}.b{animation:floatB 11s ease-in-out infinite alternate}
  .scan{animation:scan 7s linear infinite}.pulse{animation:pulse 2.8s ease-in-out infinite}
  .flow{stroke-dasharray:7 11;animation:dash 14s linear infinite}
  @keyframes floatA{from{transform:translate(-20px,-8px)}to{transform:translate(34px,14px)}}
  @keyframes floatB{from{transform:translate(16px,10px)}to{transform:translate(-34px,-14px)}}
  @keyframes scan{0%{transform:translateX(-400px);opacity:0}18%{opacity:.2}82%{opacity:.2}100%{transform:translateX(1500px);opacity:0}}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
  @keyframes dash{to{stroke-dashoffset:-180}}
  @media(prefers-reduced-motion:reduce){.a,.b,.scan,.pulse,.flow{animation:none}}
</style>

<rect width="1280" height="320" rx="28" fill="url(#bg)"/>
<rect width="1280" height="320" rx="28" fill="url(#grid)"/>
<g class="a" filter="url(#blur)"><circle cx="150" cy="60" r="170" fill="url(#glowA)"/></g>
<g class="b" filter="url(#blur)"><circle cx="1130" cy="270" r="190" fill="url(#glowB)"/></g>

<rect x="52" y="42" width="770" height="236" rx="24" fill="#0E1727" fill-opacity=".74" stroke="#94A3B8" stroke-opacity=".12"/>
<rect x="852" y="42" width="376" height="236" rx="24" fill="#0E1727" fill-opacity=".6" stroke="#94A3B8" stroke-opacity=".1"/>

<text x="88" y="82" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="2.2">TECHNOLOGY PORTFOLIO</text>
<text x="88" y="135" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="50" font-weight="700" letter-spacing="3.4">ARGENIS PADILLA</text>
<text x="88" y="176" fill="url(#accent)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" letter-spacing="1">Systems · Data Science · AI · Software · Databases · Infrastructure</text>
<text x="88" y="210" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Practical engineering across analytics, automation, development and operations.</text>

<g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#E2E8F0">
  <rect x="88" y="233" width="126" height="27" rx="13.5" fill="#111C30" stroke="#38BDF8" stroke-opacity=".28"/><text x="151" y="251" text-anchor="middle">DATA &amp; BI</text>
  <rect x="226" y="233" width="102" height="27" rx="13.5" fill="#111C30" stroke="#60A5FA" stroke-opacity=".28"/><text x="277" y="251" text-anchor="middle">LOCAL AI</text>
  <rect x="340" y="233" width="128" height="27" rx="13.5" fill="#111C30" stroke="#A78BFA" stroke-opacity=".28"/><text x="404" y="251" text-anchor="middle">WEB &amp; BACKEND</text>
  <rect x="480" y="233" width="120" height="27" rx="13.5" fill="#111C30" stroke="#38BDF8" stroke-opacity=".28"/><text x="540" y="251" text-anchor="middle">DATABASES</text>
  <rect x="612" y="233" width="164" height="27" rx="13.5" fill="#111C30" stroke="#60A5FA" stroke-opacity=".28"/><text x="694" y="251" text-anchor="middle">AUTOMATION &amp; OPS</text>
</g>

<text x="884" y="81" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="600">Integrated technology profile</text>
<text x="884" y="103" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5">From information to software to reliable operation</text>

<path class="flow" d="M924 183 C968 135 1017 135 1058 183 C1097 228 1146 226 1188 180" stroke="url(#accent)" stroke-width="2" stroke-opacity=".38" fill="none"/>
<path d="M934 183H1177" stroke="#334155" stroke-width="1" stroke-opacity=".6"/>

<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <circle cx="930" cy="183" r="27" fill="#101C30" stroke="#38BDF8" stroke-opacity=".45"/>
  <circle cx="1056" cy="183" r="27" fill="#101C30" stroke="#60A5FA" stroke-opacity=".45"/>
  <circle cx="1182" cy="183" r="27" fill="#101C30" stroke="#A78BFA" stroke-opacity=".45"/>
  <circle cx="930" cy="183" r="5" fill="#38BDF8" class="pulse"/>
  <circle cx="1056" cy="183" r="5" fill="#60A5FA" class="pulse"/>
  <circle cx="1182" cy="183" r="5" fill="#A78BFA" class="pulse"/>
  <text x="930" y="227" text-anchor="middle" fill="#E2E8F0" font-size="14" font-weight="600">DATA</text>
  <text x="1056" y="227" text-anchor="middle" fill="#E2E8F0" font-size="14" font-weight="600">BUILD</text>
  <text x="1182" y="227" text-anchor="middle" fill="#E2E8F0" font-size="14" font-weight="600">OPERATE</text>
  <text x="1056" y="255" text-anchor="middle" fill="#64748B" font-size="13">analyze · engineer · automate</text>
</g>

<rect class="scan" x="-360" y="42" width="210" height="236" fill="url(#accent)" opacity=".07" transform="skewX(-16)"/>
</svg>