name: Update profile metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches:
      - ArgenisPadill
    paths:
      - ".github/workflows/profile-metrics.yml"
      - ".github/scripts/update_profile_metrics.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate bilingual activity SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ArgenisPadill
        run: python .github/scripts/update_profile_metrics.py

      - name: Commit updated metrics
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- README.md README.en.md assets/activity-es.svg assets/activity-en.svg)" ]; then
            echo "No metric changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.en.md assets/activity-es.svg assets/activity-en.svg
          git commit -m "chore(profile): refresh responsive contribution metrics"
          git push
