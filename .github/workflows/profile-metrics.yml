name: Update profile metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches:
      - ArgenisPadill
    paths:
      - ".github/workflows/profile-metrics.yml"
      - ".github/scripts/update_profile_metrics.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate responsive bilingual activity assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ArgenisPadill
        run: python .github/scripts/update_profile_metrics.py

      - name: Validate generated profile
        run: python .github/scripts/validate_profile.py

      - name: Commit updated metrics
        shell: bash
        run: |
          FILES="README.md README.en.md assets/activity-es.svg assets/activity-en.svg assets/activity-es-light.svg assets/activity-en-light.svg"

          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "No metric changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "chore(profile): refresh adaptive contribution metrics"
          git push
